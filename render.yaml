services:
  # Backend API
  - type: web
    name: essence-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: essence-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: essence-mysql
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: essence-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: essence-mysql
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: essence-mysql
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

  # Web Frontend
  - type: web
    name: essence-web
    env: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: essence-backend
          type: web
          property: host

  # MySQL Database
  databases:
    - name: essence-mysql
      plan: free
      databaseName: essence_radio
      user: essence_user

