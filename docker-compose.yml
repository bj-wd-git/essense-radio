version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: essence-api
    ports:
      - "3000:80"      # API port
      - "3306:3306"    # MySQL port
    environment:
      - NODE_ENV=production
      - PORT=80
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USERNAME=essence_user
      - DB_PASSWORD=essence_pass
      - DB_DATABASE=essence_radio
    networks:
      - essence-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: essence-web
    ports:
      - "80:80"        # Frontend port
    # API URL is hardcoded to: http://ertapi.194.164.149.203.sslip.io/api/
    networks:
      - essence-network
    restart: unless-stopped

networks:
  essence-network:
    driver: bridge
