version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_REPO: ${GIT_REPO:-https://github.com/your/repo.git}
        GIT_BRANCH: ${GIT_BRANCH:-main}
    ports:
      - "80:80"
      - "3000:3000"
      - "3306:3306"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USERNAME=essence_user
      - DB_PASSWORD=essence_pass
      - DB_DATABASE=essence_radio
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
    volumes:
      # Persist MySQL data
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:

