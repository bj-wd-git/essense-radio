services:
  mysql:
    image: mysql:8.0
    container_name: essence-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: essence_radio
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essence-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_DATABASE: essence_radio
      JWT_SECRET: your-secret-key-change-in-production
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Rebuild native modules on startup to ensure compatibility with container architecture
    command: sh -c "npm rebuild bcrypt --build-from-source || npm install bcrypt --build-from-source && npm run start:dev"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: essence-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mysql_data:

